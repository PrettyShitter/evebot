name: Publish macOS update
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.3)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Validate release version and architecture
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version}=JSON.parse(fs.readFileSync("package.json")); if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== "v"+version || process.arch !== "arm64") process.exit(1)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:all
      - run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/packaged-smoke.mjs
      - run: pnpm release:sign
        env:
          EVE_UPDATE_PRIVATE_KEY: ${{ secrets.EVE_UPDATE_PRIVATE_KEY }}
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "EVE Trader $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/*.update.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
