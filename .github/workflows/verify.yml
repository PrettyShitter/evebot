name: Verify and package
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:all
      - if: runner.os == 'macOS'
        run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Windows'
        run: pnpm dist:win
      - run: node scripts/packaged-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-trader-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            docs/verification/
            playwright-report/
