name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:all
      - if: runner.os == 'macOS'
        run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
      - if: runner.os == 'Windows'
        run: pnpm dist:win
      - run: node scripts/packaged-smoke.mjs
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-trader-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            docs/verification/
            playwright-report/
